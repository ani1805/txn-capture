name: Transaction Platform CI Pipeline
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
           java-version: '17'
           distribution: 'temurin'
           cache: maven
      - name: Build and Test with Maven
        run: ./mvnw clean package
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/txn-capture:${GITHUB_SHA::7} .
      - name: List Docker Image
        run: docker images
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login \
          --username "${{ secrets.DOCKER_HUB_USERNAME }}" \
          --password-stdin
      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/txn-capture:${GITHUB_SHA::7}